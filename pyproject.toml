[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
"tests/*" = ["S101", "S105", "S106", "S107"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
